                height: 100%;

            .staticrypt-body {
                height: 100%;
                margin: 0;

                border-right-color: transparent;
                border-radius: 50%;

                animation-delay: 0s;

                animation-direction: normal;

                input[type="text"] {
                    font-size: 16px;
                }
